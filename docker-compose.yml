name: placewise

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    networks: [backend]

  ai-service:
    build: ./apps/ai-service
    # No published ports: reachable only from the api container on the internal network.
    expose:
      - "8000"
    networks: [internal]

  api:
    build:
      # Context is ./apps so the image can read ai-service/data (the shared skill and role catalogue).
      context: ./apps
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "8080:8080"
    networks: [backend, internal]

volumes:
  pgdata:

networks:
  backend:
  internal:
    internal: true
