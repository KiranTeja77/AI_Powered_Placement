name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image is pinned: `ubuntu-latest` moves to a new major image on a schedule.
jobs:
  # The web job needs neither the API nor Docker. API types (src/lib/api/schema.d.ts) are
  # generated with `pnpm gen:api` and committed, so CI uses them as they are. End-to-end tests
  # need the full stack and run locally for now.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from "packageManager" in package.json, so CI and local match.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      # Node's version comes from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers; the runner provides Docker.
      - run: ./mvnw -B verify

  ai-service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
