[project]
name = "ai-service"
version = "0.1.0"
description = "PlaceWise resume analyzer (internal service)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.3",
    "pydantic>=2.14.3",
    "rapidfuzz>=3.14.6",
    "spacy>=3.8.18",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
