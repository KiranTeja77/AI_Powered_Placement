spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placewise}
    username: ${DB_USER:placewise}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

app:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: 10s
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    # Hibernate prints whole entities at DEBUG, and resume_analysis holds the resume text and the
    # analysis. An explicit level here wins over a global DEBUG, so resumes cannot reach the logs.
    org.hibernate.orm.core: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
